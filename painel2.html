<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magri — Painel da Equipe</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#243149;--txt:#e2e8f0;--muted:#94a3b8;--verde:#2ecc71;--amarelo:#f1c40f;--vermelho:#e74c3c;--ouro:#c8a24a;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif;height:100vh;overflow:hidden}
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e293b);display:flex;align-items:center;justify-content:center;z-index:50}
#gate .box{background:#111827;padding:26px 28px;border-radius:14px;width:330px;max-width:90%}
#gate h1{font-size:20px;color:#38bdf8;margin-bottom:4px}
#gate .sub{font-size:12px;color:var(--muted);margin-bottom:16px}
#gate input{width:100%;padding:10px;margin-bottom:8px;border-radius:8px;border:1px solid #334155;background:#0b1220;color:#fff}
#gate button{width:100%;padding:11px;border:none;border-radius:8px;background:#38bdf8;color:#0b1220;font-weight:800;cursor:pointer}
#gerr{color:#f87171;font-size:12px;margin-top:8px;min-height:16px}
#app{display:none;flex-direction:column;height:100vh;padding:14px 16px}
.hd{display:flex;align-items:center;gap:14px;border-bottom:2px solid #334155;padding-bottom:8px;margin-bottom:10px}
.hd h1{font-size:24px;color:#fff}
.hd .mes{font-size:17px;color:var(--ouro);font-weight:700}
.hd .right{margin-left:auto;text-align:right;color:var(--muted);font-size:12px}
.hd .clock{font-size:20px;color:#fff;font-weight:700}
.destaque{display:flex;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.dcard{flex:1;min-width:180px;background:linear-gradient(135deg,#243149,#1b2740);border:1px solid #3a4a6b;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.dcard .medal{font-size:30px}
.dcard .nm{font-size:16px;font-weight:800;color:#fff;line-height:1.1}
.dcard .pc{font-size:12px;color:var(--muted)}
.grid{flex:1;display:flex;flex-direction:column;overflow:auto}
.stage-h{font-size:16px;font-weight:800;color:#fff;margin:4px 0 6px;padding-bottom:3px;border-bottom:2px solid #334155}
.stagegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:12px}
.sec{background:var(--card);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.sec h2{font-size:15px;color:#fff;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.sec .meta{font-size:10px;color:var(--muted);margin-bottom:7px;line-height:1.3}
.urow{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:7px;margin-bottom:4px;background:var(--card2)}
.urow .nm{font-weight:700;font-size:12px;flex:1;min-width:0;line-height:1.15;word-break:break-word}
.urow .hoje{font-size:10px;color:#cbd5e1;min-width:74px;text-align:right;line-height:1.2}
.urow .bar{width:88px;height:12px;background:#0b1220;border-radius:6px;overflow:hidden;flex-shrink:0}
.urow .bar > div{height:100%}
.urow .pct{font-size:12px;font-weight:800;min-width:40px;text-align:right}
.empty{color:var(--muted);font-size:12px;padding:6px 2px}
.upd{font-size:11px;color:var(--muted)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="gate"><div class="box">
  <h1>Magri — Painel da Equipe</h1>
  <div class="sub">Acompanhamento de metas e desempenho</div>
  <input id="em" type="text" placeholder="Usuário ou e-mail" autocomplete="username">
  <input id="pw" type="password" placeholder="Senha" autocomplete="current-password">
  <button id="go">Entrar</button>
  <div id="gerr"></div>
</div></div>

<div id="app">
  <div class="hd">
    <h1>👥 Equipe — Metas & Desempenho</h1>
    <div class="mes" id="mesLbl"></div>
    <div class="right"><div class="clock" id="clock"></div><div class="upd" id="upd"></div></div>
  </div>
  <div id="empresaBox" style="margin-bottom:10px"></div>
  <div class="destaque" id="destaque"></div>
  <div id="ganColetiva" style="margin-bottom:10px"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
var SB_URL='https://ibdubxoxupoxkskcupxd.supabase.co';
var SB_KEY='sb_publishable_O2K1r_rmv9pWSOF_1M1Mkg_jIUqwtPZ';
var sb=supabase.createClient(SB_URL,SB_KEY);
var METAS_DEFAULT={comercial:{os:10,kg:7},foto:{fotos:300,kg:6},banhado:{kg:14},expedicao:{kg:6,itens:300},posvenda:{dia:5},empresa:{banhoMes:300}};
var PV_HOJE=0,PV_MES=0;
var M=JSON.parse(JSON.stringify(METAS_DEFAULT));
function _ajustaMetas(){if(!M.banhado){M.banhado={kg:(M.gancheira&&M.gancheira.kg)||14};}['comercial','foto','banhado','expedicao'].forEach(function(k){if(!M[k])M[k]=JSON.parse(JSON.stringify(METAS_DEFAULT[k]));});if(!(M.foto.kg>0)||M.foto.kg===5)M.foto.kg=6;if(!(M.expedicao.kg>0)||M.expedicao.kg===5)M.expedicao.kg=6;if(!M.empresa)M.empresa={banhoMes:300};if(!(M.empresa.banhoMes>0))M.empresa.banhoMes=300;if(!M.posvenda)M.posvenda={dia:5};if(!(M.posvenda.dia>0))M.posvenda.dia=5;}

function hojeISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ymAtual(){return hojeISO().slice(0,7);}
function diasUteisMes(ym){var p=(''+ym).split('-');var y=+p[0],m=+p[1];if(!y||!m)return 22;var d=new Date(y,m-1,1),c=0;while(d.getMonth()===m-1){var w=d.getDay();if(w!==0&&w!==6)c++;d.setDate(d.getDate()+1);}return c||1;}
function g1(v){return (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});}
function pesoDecl(o){var t=0;(o.itens||[]).forEach(function(it){t+=(parseFloat(it.peso)||0);});return t||parseFloat(o.peso)||0;}
function pesoFinalOS(o){var t=0;(o.itens||[]).forEach(function(it){if(it.subitens&&it.subitens.length){it.subitens.forEach(function(sb){t+=(parseFloat(sb.pesoFinalExp)||0);});}else{t+=(parseFloat(it.pesoFinal)||0);}});return t;}
function corPct(p){return p>=100?'var(--verde)':(p>=80?'var(--amarelo)':'var(--vermelho)');}
function normNome(n){return (''+(n||'')).trim().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');}
function excluido(n){return !n||/RODOLFO|MARIELLA/.test(n);}
function esc(s){return (''+s).replace(/</g,'&lt;');}
function kgFarolCor(v,meta){meta=meta||0;if(meta<=0)return 'var(--vermelho)';if(v>=meta)return 'var(--verde)';if(v>=meta*2/3)return 'var(--amarelo)';return 'var(--vermelho)';}
var GAN_MES=0,GAN_HOJE=0;

var MES7='',DU=22;
function relogio(){var d=new Date();document.getElementById('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
setInterval(relogio,1000);relogio();

var SEC=[
  {key:'com',nome:'🛒 Comercial',ms:[{k:'kg',lbl:'Kg',meta:function(){return M.comercial.kg;},farol:'pct'}]},
  {key:'fb',nome:'📷 Foto / Bruto',ms:[{k:'fotos',lbl:'Itens',meta:function(){return M.foto.fotos;},int:true,farol:'pct'},{k:'kg',lbl:'Kg',meta:function(){return M.foto.kg;},farol:'kgabs'}]},
  {key:'exp',nome:'📦 Expedição',ms:[{k:'itens',lbl:'Itens',meta:function(){return M.expedicao.itens;},int:true,farol:'pct'},{k:'kg',lbl:'Kg',meta:function(){return M.expedicao.kg;},farol:'kgabs'}]}
];
function mRank(m,val){if(m.farol==='kgabs'){var mt=m.meta()||0;return val>=mt?100:(mt>0&&val>=mt*2/3?80:0);}var mp=m.meta()||0;return mp>0?val/mp*100:0;}
function mPct(m,val){var mt=m.meta()||0;return mt>0?Math.round(val/mt*100):0;}
function mCor(m,val){if(m.farol==='kgabs')return kgFarolCor(val,m.meta());return corPct(mPct(m,val));}
function _raw(P,n,sec,m){return (P[n][sec.key]||{})[m.k]||{h:0,m:0};}
function secRankMes(P,n,sec){return Math.max.apply(null,sec.ms.map(function(m){return mRank(m,(_raw(P,n,sec,m).m||0)/DU);}));}
function secRankHoje(P,n,sec){return Math.max.apply(null,sec.ms.map(function(m){return mRank(m,(_raw(P,n,sec,m).h||0));}));}
function secUsouHoje(P,n,sec){return sec.ms.some(function(m){return (_raw(P,n,sec,m).h||0)>0;});}

function _add(P,user,sec,metric,val,hoje){if(!user)return;user=normNome(user);if(excluido(user))return;P[user]=P[user]||{};var s=P[user][sec]=P[user][sec]||{};var mm=s[metric]=s[metric]||{h:0,m:0};mm.m+=val;if(hoje)mm.h+=val;}

function computa(ordens,apont){
  var ym=MES7,hj=hojeISO();var P={};GAN_MES=0;GAN_HOJE=0;
  (ordens||[]).forEach(function(o){if(!o||o._del||o.cancelada)return;
    // Comercial
    if(o.comUser){var d=(''+(o.dataEntrada||'')).slice(0,10);if(d.slice(0,7)===ym){var t=d===hj;_add(P,o.comUser,'com','os',1,t);_add(P,o.comUser,'com','kg',pesoDecl(o),t);}}
    // Foto/Bruto
    var f=o.fb||{};
    (o.itens||[]).forEach(function(it){(it.subitens||[]).forEach(function(sb){var who=sb.criadoPor||o.fbUser||f.resp;var d=(''+(sb.criadoEm||f.concluidoEm||'')).slice(0,10);if(!who||d.slice(0,7)!==ym)return;var t=d===hj;_add(P,who,'fb','fotos',1,t);_add(P,who,'fb','kg',(parseFloat(sb.peso)||0),t);});});
    // Expedição por peça (quem deu o Sim)
    var e=o.exp||{};var cxs=o.caixas||[];var eWho0=o.expUser||e.resp||(cxs.length?cxs[cxs.length-1].resp:'');var ed0=(''+(e.concluidoEm||(cxs.length?cxs[cxs.length-1].fechadaEm:'')||o.dataSaida||'')).slice(0,10);
    (o.itens||[]).forEach(function(it){var subs=it.subitens||[];
      if(subs.length){subs.forEach(function(sb){if(sb.confExp!=='Sim')return;var who=sb.confExpUser||eWho0;var d=(''+(sb.confExpEm||ed0||'')).slice(0,10);if(!who||d.slice(0,7)!==ym)return;var t=d===hj;_add(P,who,'exp','itens',(parseInt(sb.contagemExp)||parseInt(sb.qtd)||0),t);_add(P,who,'exp','kg',(parseFloat(sb.pesoFinalExp)||0),t);});}
      else{if(eWho0&&ed0.slice(0,7)===ym){var t2=ed0===hj;_add(P,eWho0,'exp','itens',1,t2);_add(P,eWho0,'exp','kg',(parseFloat(it.pesoFinal)||0),t2);}}
    });
  });
  (apont||[]).forEach(function(a){if(!a)return;var d=(''+(a.data||'')).slice(0,10);if(d.slice(0,7)===ym){GAN_MES+=(a.peso||0);if(d===hj)GAN_HOJE+=(a.peso||0);}});
  return P;
}

function secUsou(P,n,sec){return sec.ms.some(function(m){return (_raw(P,n,sec,m).m||0)>0;});}
function _unit(m){return m.farol==='kgabs'?'kg':'it';}
function _blocoSetor(P,nomes,sec,mode){
  var us=nomes.filter(function(n){return mode==='hoje'?secUsouHoje(P,n,sec):secUsou(P,n,sec);})
    .sort(function(a,b){return (mode==='hoje'?secRankHoje(P,b,sec):secRankMes(P,b,sec))-(mode==='hoje'?secRankHoje(P,a,sec):secRankMes(P,a,sec));});
  var metaTxt=sec.ms.map(function(m){return (m.int?Math.round(m.meta()):g1(m.meta()))+' '+(m.farol==='kgabs'?'kg':'itens');}).join(' ou ');
  var rows=us.map(function(n){
    var vals=sec.ms.map(function(m){var raw=_raw(P,n,sec,m);var v=mode==='hoje'?(raw.h||0):(raw.m||0);var base=mode==='hoje'?v:(v/DU);var cor=mCor(m,base);var disp=m.int?Math.round(v):g1(v);return '<span style="color:'+cor+'">'+disp+_unit(m)+'</span>';}).join(' · ');
    var rk=Math.round(mode==='hoje'?secRankHoje(P,n,sec):secRankMes(P,n,sec));var cor=corPct(rk);
    return '<div class="urow"><span class="nm">'+esc(n)+'</span><span class="hoje">'+vals+'</span><div class="bar"><div style="width:'+Math.min(100,rk)+'%;background:'+cor+'"></div></div><span class="pct" style="color:'+cor+'">'+rk+'%</span></div>';
  }).join('');
  var sub=mode==='hoje'?('Hoje vs meta/dia: '+metaTxt):('Mês (acumulado) · meta/dia: '+metaTxt);
  return '<div class="sec"><h2>'+sec.nome+'</h2><div class="meta">'+sub+'</div>'+(rows||'<div class="empty">'+(mode==='hoje'?'Nada lançado hoje.':'Sem lançamentos no mês.')+'</div>')+'</div>';
}

function render(P){
  document.getElementById('mesLbl').textContent=({'01':'Janeiro','02':'Fevereiro','03':'Março','04':'Abril','05':'Maio','06':'Junho','07':'Julho','08':'Agosto','09':'Setembro','10':'Outubro','11':'Novembro','12':'Dezembro'}[MES7.slice(5,7)]||'')+' '+MES7.slice(0,4)+' · '+DU+' dias úteis';
  var nomes=Object.keys(P);
  // ===== Meta da empresa: % por setor (média da equipe) + coletivo =====
  var bMetaEmp=(M.empresa&&M.empresa.banhoMes)||300;var bPctEmp=bMetaEmp>0?Math.min(300,Math.round(GAN_MES/bMetaEmp*100)):0;
  var pvMetaE=(M.posvenda&&M.posvenda.dia)||5;var pvPctEmp=(pvMetaE*DU)>0?Math.round(PV_MES/(pvMetaE*DU)*100):0;var pvHojePct=pvMetaE>0?Math.round(PV_HOJE/pvMetaE*100):0;var pvCorH=corPct(pvHojePct);var pvCorM=corPct(pvPctEmp);
  var setPcts=SEC.map(function(sec){var us=nomes.filter(function(n){return secUsou(P,n,sec);});var avg=us.length?Math.round(us.reduce(function(s,n){return s+secRankMes(P,n,sec);},0)/us.length):0;return {nome:sec.nome,pct:avg,tem:us.length>0};});
  var comp=[];setPcts.forEach(function(s){if(s.tem)comp.push(s.pct);});comp.push(bPctEmp);comp.push(pvPctEmp);
  var empPct=comp.length?Math.round(comp.reduce(function(a,b){return a+b;},0)/comp.length):0;var empCor=corPct(empPct);
  var barItem=function(nome,pct){var c=corPct(pct);return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="width:120px;font-size:12px;color:#cbd5e1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+nome+'</span><div style="flex:1;height:14px;background:#0b1220;border-radius:7px;overflow:hidden"><div style="width:'+Math.min(100,pct)+'%;height:100%;background:'+c+'"></div></div><span style="width:46px;text-align:right;font-weight:800;font-size:12px;color:'+c+'">'+pct+'%</span></div>';};
  var barras=setPcts.map(function(s){return s.tem?barItem(s.nome,s.pct):'';}).join('')+barItem('🛁 Volume banhado',bPctEmp)+barItem('📞 Pós-venda',pvPctEmp);
  document.getElementById('empresaBox').innerHTML='<div style="background:linear-gradient(135deg,#1b2740,#243149);border:1px solid #3a4a6b;border-radius:12px;padding:12px 16px"><div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px"><div style="font-size:18px;font-weight:800;color:#fff">🏭 Meta da empresa</div><div style="font-size:12px;color:var(--muted)">banho '+g1(GAN_MES)+' / '+g1(bMetaEmp)+' kg no mês · média das metas por setor + coletivo</div><div style="margin-left:auto;display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:160px;width:200px;height:18px;background:#0b1220;border-radius:9px;overflow:hidden"><div style="width:'+Math.min(100,empPct)+'%;height:100%;background:'+empCor+'"></div></div><div style="font-size:26px;font-weight:800;color:'+empCor+'">'+empPct+'%</div></div></div>'+barras+'</div>';
  // destaque: média dos % mensais dos setores que a pessoa atuou
  var rank=nomes.map(function(n){var ps=[];SEC.forEach(function(s){if(secUsou(P,n,s))ps.push(secRankMes(P,n,s));});var avg=ps.length?ps.reduce(function(a,b){return a+b;},0)/ps.length:0;return {n:n,avg:avg,nsec:ps.length};}).filter(function(x){return x.nsec>0;}).sort(function(a,b){return b.avg-a.avg;});
  var med=['🥇','🥈','🥉'];
  document.getElementById('destaque').innerHTML=rank.slice(0,3).map(function(x,i){return '<div class="dcard"><div class="medal">'+med[i]+'</div><div><div class="nm">'+esc(x.n)+'</div><div class="pc">'+Math.round(x.avg)+'% das metas · '+x.nsec+' setor(es)</div></div></div>';}).join('')||'<div class="dcard"><div class="pc">Sem dados no mês ainda.</div></div>';
  // Volume banhado coletivo (amarração + banho + qualidade) — kg apontado da equipe
  var bMeta=M.banhado.kg||0;var bMed=GAN_MES/DU;var bPctMes=bMeta>0?Math.round(GAN_MES/(bMeta*DU)*100):0;var bCorMes=kgFarolCor(bMed,bMeta);var bCorHoje=kgFarolCor(GAN_HOJE,bMeta);var bPctHoje=bMeta>0?Math.round(GAN_HOJE/bMeta*100):0;
  document.getElementById('ganColetiva').innerHTML='<div style="background:var(--card);border:1px solid #3a4a6b;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div style="font-size:16px;font-weight:800;color:#fff">🛁 Volume banhado — meta coletiva</div><div style="font-size:12px;color:var(--muted)">amarração + banho + qualidade (kg apontado) · meta '+g1(bMeta)+' kg/dia ('+g1(bMeta*DU)+' kg/mês)</div><div style="font-size:13px;color:#cbd5e1">hoje <b style="color:'+bCorHoje+'">'+g1(GAN_HOJE)+'kg</b> ('+bPctHoje+'%) · mês <b>'+g1(GAN_MES)+'kg</b> · média/dia <b style="color:'+bCorMes+'">'+g1(bMed)+'kg</b></div><div style="flex:1;min-width:120px;height:16px;background:#0b1220;border-radius:8px;overflow:hidden"><div style="width:'+Math.min(100,bPctMes)+'%;height:100%;background:'+bCorMes+'"></div></div><div style="font-size:18px;font-weight:800;color:'+bCorMes+'">'+bPctMes+'%</div></div>'+
    '<div style="background:var(--card);border:1px solid #3a4a6b;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px"><div style="font-size:16px;font-weight:800;color:#fff">📞 Pós-venda — meta coletiva</div><div style="font-size:12px;color:var(--muted)">registros de contato com cliente · meta '+pvMetaE+'/dia ('+(pvMetaE*DU)+'/mês)</div><div style="font-size:13px;color:#cbd5e1">hoje <b style="color:'+pvCorH+'">'+PV_HOJE+'</b> ('+pvHojePct+'%) · mês <b>'+PV_MES+'</b></div><div style="flex:1;min-width:120px;height:16px;background:#0b1220;border-radius:8px;overflow:hidden"><div style="width:'+Math.min(100,pvPctEmp)+'%;height:100%;background:'+pvCorM+'"></div></div><div style="font-size:18px;font-weight:800;color:'+pvCorM+'">'+pvPctEmp+'%</div></div>';
  // duas etapas
  var ehAtual=(MES7===ymAtual());
  var html='<div class="stage-h">📅 Acompanhamento diário'+(ehAtual?(' — hoje '+hojeISO().split('-').reverse().join('/')):'')+'</div>';
  if(!ehAtual){html+='<div class="empty" style="margin-bottom:12px">Disponível no mês atual.</div>';}
  else{html+='<div class="stagegrid">'+SEC.map(function(s){return _blocoSetor(P,nomes,s,'hoje');}).join('')+'</div>';}
  html+='<div class="stage-h">📈 Evolução da meta mensal — '+DU+' dias úteis (meta do mês = meta/dia × '+DU+')</div>';
  html+='<div class="stagegrid">'+SEC.map(function(s){return _blocoSetor(P,nomes,s,'mes');}).join('')+'</div>';
  document.getElementById('grid').innerHTML=html;
  var n=new Date();document.getElementById('upd').textContent='v3 · atualizado '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
}

async function loadAll(tb){var out=[],f=0,pg=1000;while(true){var r=await sb.from(tb).select('dados').order('id',{ascending:true}).range(f,f+pg-1);if(r.error){break;}var d=r.data||[];out=out.concat(d.map(function(x){return x.dados;}));if(d.length<pg)break;f+=pg;}return out;}

async function carregar(){
  try{
    MES7=ymAtual();DU=diasUteisMes(MES7);
    try{var cm=await sb.from('config').select('valor').eq('chave','magri_metas_v1').maybeSingle();if(cm&&cm.data&&cm.data.valor){M=cm.data.valor;}}catch(e){}
    _ajustaMetas();
    try{var cc=await sb.from('config').select('valor').eq('chave','magri_contatos_v1').maybeSingle();var ctts=(cc&&cc.data&&cc.data.valor)||[];if(!Array.isArray(ctts))ctts=[];var hj=hojeISO();PV_HOJE=ctts.filter(function(c){return (''+(c.data||'')).slice(0,10)===hj;}).length;PV_MES=ctts.filter(function(c){return (''+(c.data||'')).slice(0,7)===MES7;}).length;}catch(e){PV_HOJE=0;PV_MES=0;}
    var ordens=await loadAll('ordens');
    var apont=await loadAll('apontamentos');
    var P=computa(ordens,apont);
    render(P);
  }catch(e){console.warn('carregar',e);}
}

function iniciar(){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='flex';carregar();setInterval(carregar,60000);setTimeout(function(){location.replace(location.pathname+'?t='+Date.now());},25*60*1000);}
function login(msg){document.getElementById('gate').style.display='flex';document.getElementById('app').style.display='none';if(msg)document.getElementById('gerr').textContent=msg;}
async function entrar(){var raw=document.getElementById('em').value.trim();var pw=document.getElementById('pw').value;if(!raw||!pw){document.getElementById('gerr').textContent='Informe usuário e senha.';return;}var email=raw.indexOf('@')>-1?raw.toLowerCase():(raw.toLowerCase().replace(/\s+/g,'')+'@magrifolheados.com.br');document.getElementById('gerr').textContent='Entrando...';var r=await sb.auth.signInWithPassword({email:email,password:pw});if(r.error){document.getElementById('gerr').textContent='Usuário ou senha inválidos.';return;}iniciar();}
document.getElementById('go').onclick=entrar;
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')entrar();});
sb.auth.getSession().then(function(res){if(res.data.session)iniciar();else login('');}).catch(function(){login('');});
</script>
